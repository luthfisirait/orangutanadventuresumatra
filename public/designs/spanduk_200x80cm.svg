<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 800" width="2000" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b14"/>
      <stop offset="50%" stop-color="#0b3524"/>
      <stop offset="100%" stop-color="#071b14"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb51b"/>
      <stop offset="100%" stop-color="#d2642f"/>
    </linearGradient>
    <linearGradient id="fur" x1="46" y1="35" x2="193" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4a742"/>
      <stop offset="0.58" stop-color="#d2642f"/>
      <stop offset="1" stop-color="#a94524"/>
    </linearGradient>
    <linearGradient id="leaf" x1="52" y1="55" x2="198" y2="169" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8bd42"/>
      <stop offset="1" stop-color="#1d5a40"/>
    </linearGradient>
    <linearGradient id="river" x1="27" y1="187" x2="226" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c7882"/>
      <stop offset="1" stop-color="#123c2c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="2000" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Rainforest Decorative Circles -->
  <circle cx="180" cy="400" r="320" fill="#17613d" opacity="0.18"/>
  <circle cx="1850" cy="200" r="280" fill="#0e6b76" opacity="0.18"/>
  <circle cx="1950" cy="700" r="350" fill="#ffb51b" opacity="0.06"/>

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="1950" height="750" fill="none" stroke="#d2642f" stroke-width="4" stroke-opacity="0.6" rx="16"/>
  <rect x="35" y="35" width="1930" height="730" fill="none" stroke="#ffb51b" stroke-width="1.5" stroke-opacity="0.3" rx="10"/>

  <!-- Eyelets / Mata Ayam Grommets Markers -->
  <g fill="#777" stroke="#333" stroke-width="2">
    <circle cx="45" cy="45" r="14" fill="#a0a0a0"/>
    <circle cx="45" cy="45" r="7" fill="#0b3524"/>
    <circle cx="1000" cy="45" r="14" fill="#a0a0a0"/>
    <circle cx="1000" cy="45" r="7" fill="#0b3524"/>
    <circle cx="1955" cy="45" r="14" fill="#a0a0a0"/>
    <circle cx="1955" cy="45" r="7" fill="#0b3524"/>

    <circle cx="45" cy="755" r="14" fill="#a0a0a0"/>
    <circle cx="45" cy="755" r="7" fill="#0b3524"/>
    <circle cx="1000" cy="755" r="14" fill="#a0a0a0"/>
    <circle cx="1000" cy="755" r="7" fill="#0b3524"/>
    <circle cx="1955" cy="755" r="14" fill="#a0a0a0"/>
    <circle cx="1955" cy="755" r="7" fill="#0b3524"/>
  </g>

  <!-- Left: Circular Logo Emblem -->
  <g transform="translate(120, 150)" filter="url(#shadow)">
    <!-- Outer badge ring -->
    <circle cx="200" cy="200" r="185" fill="#071b14" stroke="#ffb51b" stroke-width="6"/>
    <circle cx="200" cy="200" r="172" fill="none" stroke="#d2642f" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Scaled Vector Logo Mark -->
    <g transform="translate(64, 64) scale(1)">
      <g fill="none" stroke="#d2642f" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="136" cy="136" r="124" stroke-width="8"/>
        <path d="M58 74c28-28 70-41 110-27 31 11 55 37 65 68" stroke-width="8"/>
        <path d="M35 188c42 42 111 49 160 15 19-13 34-31 43-52" stroke-width="8"/>
      </g>
      <g transform="translate(32 30)">
        <path fill="url(#leaf)" d="M22 74c34-48 86-63 137-46-31 4-58 17-80 39-20 20-33 44-39 71-12-18-18-39-18-64Z"/>
        <path fill="#123c2c" d="M33 170c39 18 83 21 122 7 35-12 62-36 79-67-7 47-35 82-78 100-44 19-94 13-123-40Z" opacity=".9"/>
        <path fill="url(#river)" d="M17 186c34 22 76 29 118 20 37-8 66-27 87-51 0 28-17 52-48 69-47 24-112 11-157-38Z"/>
        <path fill="url(#fur)" d="M54 123c0-47 36-85 85-85 45 0 78 32 78 75 0 30-17 55-42 69-9 6-14 14-15 24l-2 22H91l-2-27c-1-9-7-18-15-24-13-10-20-30-20-54Z"/>
        <path fill="#fff5df" d="M91 113c10-19 27-29 48-29 23 0 40 11 49 30 7 15 4 33-8 46-10 11-24 17-41 17-18 0-33-6-42-18-11-13-13-31-6-46Z"/>
        <path fill="#d2642f" d="M99 120c10-16 23-24 40-24 18 0 31 8 40 24-10-6-23-9-40-9-16 0-29 3-40 9Z"/>
        <path fill="#72351f" d="M110 129c0-8 6-14 14-14s14 6 14 14-6 14-14 14-14-6-14-14Zm31 0c0-8 6-14 14-14s14 6 14 14-6 14-14 14-14-6-14-14Z"/>
        <path fill="#fff5df" d="M118 125a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm31 0a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
        <path fill="#72351f" d="M132 145c4-5 10-7 17-7s13 2 17 7c-5 4-10 6-17 6s-12-2-17-6Z"/>
        <path fill="none" stroke="#72351f" stroke-linecap="round" stroke-width="6" d="M111 163c18 12 49 12 68-1"/>
        <path fill="#a94524" d="M63 87c-20 21-27 55-16 83-19-20-24-57-13-87 7-19 20-36 38-47-5 14-8 31-9 51Zm157-9c24 24 31 64 17 94 23-21 30-64 16-98-9-23-27-41-51-50 10 16 16 33 18 54Z" opacity=".82"/>
        <path fill="none" stroke="#fff5df" stroke-linecap="round" stroke-width="7" d="M84 70c21-17 48-23 74-16M74 91c21-14 48-19 74-12M72 196c25 18 59 25 92 17"/>
      </g>
    </g>
  </g>

  <!-- Center Right: Typography Hierarchy -->
  <g transform="translate(580, 130)">
    <!-- Kicker Tag -->
    <rect x="0" y="20" width="460" height="42" rx="8" fill="#17613d" stroke="#d8ff3e" stroke-width="1.5"/>
    <text x="230" y="48" fill="#d8ff3e" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="4">BUKIT LAWANG - NORTH SUMATRA</text>

    <!-- Main Title Line 1 & Line 2 -->
    <text x="0" y="150" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" letter-spacing="4" filter="url(#shadow)">ORANGUTAN ADVENTURE</text>
    <text x="0" y="240" fill="#ffb51b" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" letter-spacing="4" filter="url(#shadow)">SUMATRA</text>

    <!-- Subtitle / Core Services -->
    <text x="0" y="315" fill="#edf1e7" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1.5">
      Jungle Trekking • Ethical Wildlife Tours • River Tubing
    </text>

    <!-- Bullet Badges -->
    <g transform="translate(0, 360)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="280" height="48" rx="24" fill="#071b14" stroke="#ffb51b" stroke-width="2"/>
      <circle cx="24" cy="24" r="8" fill="#ffb51b"/>
      <text x="44" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">1 to 5 Days Treks</text>

      <!-- Badge 2 -->
      <rect x="300" y="0" width="310" height="48" rx="24" fill="#071b14" stroke="#ffb51b" stroke-width="2"/>
      <circle cx="324" cy="24" r="8" fill="#ffb51b"/>
      <text x="344" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">Certified Local Guides</text>

      <!-- Badge 3 -->
      <rect x="630" y="0" width="300" height="48" rx="24" fill="#071b14" stroke="#ffb51b" stroke-width="2"/>
      <circle cx="654" cy="24" r="8" fill="#ffb51b"/>
      <text x="674" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="19" font-weight="700">Gunung Leuser NP</text>
    </g>
  </g>

  <!-- Bottom Strip: Contact Bar -->
  <g transform="translate(60, 640)">
    <rect x="0" y="0" width="1880" height="95" rx="14" fill="#071b14" stroke="#d2642f" stroke-width="3" filter="url(#shadow)"/>

    <!-- WhatsApp Box -->
    <g transform="translate(40, 20)">
      <!-- WhatsApp Icon Circle -->
      <circle cx="28" cy="28" r="28" fill="#25D366"/>
      <!-- Telephone handset icon -->
      <path d="M19 14c-1-2-3-2-4-2s-3 1-4 2c-3 3-3 8 2 14 6 7 12 7 15 4 1-1 2-2 2-4s-1-3-3-4l-3-1c-1 0-2 0-2 1l-1 2c-1 0-3-1-5-3s-3-4-3-5l2-1c1-1 1-2 1-3z" fill="#ffffff"/>
      <text x="75" y="24" fill="#88c999" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="1">BOOKING &amp; WHATSAPP</text>
      <text x="75" y="48" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="30" letter-spacing="1.5">+62 853 6240 5752</text>
    </g>

    <!-- Divider -->
    <line x1="680" y1="18" x2="680" y2="78" stroke="#335544" stroke-width="2"/>

    <!-- Website Box -->
    <g transform="translate(720, 20)">
      <circle cx="28" cy="28" r="28" fill="#0e6b76"/>
      <!-- Globe Icon -->
      <circle cx="28" cy="28" r="16" fill="none" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="28" cy="28" rx="8" ry="16" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="12" y1="28" x2="44" y2="28" stroke="#fff" stroke-width="2"/>
      <text x="75" y="24" fill="#80cbd4" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="1">OFFICIAL WEBSITE</text>
      <text x="75" y="48" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="30" letter-spacing="1.5">orangutanadventuresumatra.com</text>
    </g>

    <!-- Divider -->
    <line x1="1470" y1="18" x2="1470" y2="78" stroke="#335544" stroke-width="2"/>

    <!-- Instagram & Location Box -->
    <g transform="translate(1500, 20)">
      <circle cx="28" cy="28" r="28" fill="#d2642f"/>
      <!-- Pin Icon -->
      <path d="M28 14c-6 0-10 4-10 10 0 8 10 18 10 18s10-10 10-18c0-6-4-10-10-10zm0 13c-2 0-3-1-3-3s1-3 3-3 3 1 3 3-1 3-3 3z" fill="#ffffff"/>
      <text x="75" y="24" fill="#ffb51b" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="1">INSTAGRAM &amp; TRIP</text>
      <text x="75" y="48" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="28" letter-spacing="1">@orangutanadventuresumatra</text>
    </g>
  </g>
</svg>
