<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1600" width="600" height="1600">
  <defs>
    <linearGradient id="bgGradVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071b14"/>
      <stop offset="35%" stop-color="#0b3524"/>
      <stop offset="70%" stop-color="#071b14"/>
      <stop offset="100%" stop-color="#05140e"/>
    </linearGradient>
    <linearGradient id="fur" x1="46" y1="35" x2="193" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4a742"/>
      <stop offset="0.58" stop-color="#d2642f"/>
      <stop offset="1" stop-color="#a94524"/>
    </linearGradient>
    <linearGradient id="leaf" x1="52" y1="55" x2="198" y2="169" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8bd42"/>
      <stop offset="1" stop-color="#1d5a40"/>
    </linearGradient>
    <linearGradient id="river" x1="27" y1="187" x2="226" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c7882"/>
      <stop offset="1" stop-color="#123c2c"/>
    </linearGradient>
    <filter id="shadowVert" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="1600" fill="url(#bgGradVert)"/>

  <!-- Border & Grommet Points -->
  <rect x="20" y="20" width="560" height="1560" fill="none" stroke="#d2642f" stroke-width="3" rx="12" stroke-opacity="0.7"/>
  <rect x="28" y="28" width="544" height="1544" fill="none" stroke="#ffb51b" stroke-width="1" rx="8" stroke-opacity="0.3"/>

  <!-- 4 Corner Eyelets for X-Banner Frame -->
  <g fill="#a0a0a0" stroke="#333" stroke-width="2">
    <circle cx="35" cy="35" r="12"/>
    <circle cx="35" cy="35" r="6" fill="#071b14"/>
    <circle cx="565" cy="35" r="12"/>
    <circle cx="565" cy="35" r="6" fill="#071b14"/>
    <circle cx="35" cy="1565" r="12"/>
    <circle cx="35" cy="1565" r="6" fill="#071b14"/>
    <circle cx="565" cy="1565" r="12"/>
    <circle cx="565" cy="1565" r="6" fill="#071b14"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(300, 100)">
    <rect x="-180" y="0" width="360" height="38" rx="8" fill="#17613d" stroke="#d8ff3e" stroke-width="1.5"/>
    <text x="0" y="25" fill="#d8ff3e" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">BUKIT LAWANG • SUMATRA</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(300, 180)">
    <text x="0" y="20" fill="#ffffff" font-family="'Impact', Arial Black, sans-serif" font-size="46" text-anchor="middle" letter-spacing="2">ORANGUTAN</text>
    <text x="0" y="70" fill="#ffffff" font-family="'Impact', Arial Black, sans-serif" font-size="46" text-anchor="middle" letter-spacing="2">ADVENTURE</text>
    <text x="0" y="125" fill="#ffb51b" font-family="'Impact', Arial Black, sans-serif" font-size="52" text-anchor="middle" letter-spacing="3">SUMATRA</text>
  </g>

  <!-- Big Central Logo Mark -->
  <g transform="translate(170, 340)" filter="url(#shadowVert)">
    <circle cx="130" cy="130" r="130" fill="#071b14" stroke="#ffb51b" stroke-width="5"/>
    <circle cx="130" cy="130" r="120" fill="none" stroke="#d2642f" stroke-width="2" stroke-dasharray="6 4"/>
    <g transform="translate(-6, -6) scale(1)">
      <g fill="none" stroke="#d2642f" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="136" cy="136" r="124" stroke-width="8"/>
        <path d="M58 74c28-28 70-41 110-27 31 11 55 37 65 68" stroke-width="8"/>
        <path d="M35 188c42 42 111 49 160 15 19-13 34-31 43-52" stroke-width="8"/>
      </g>
      <g transform="translate(32 30)">
        <path fill="url(#leaf)" d="M22 74c34-48 86-63 137-46-31 4-58 17-80 39-20 20-33 44-39 71-12-18-18-39-18-64Z"/>
        <path fill="#123c2c" d="M33 170c39 18 83 21 122 7 35-12 62-36 79-67-7 47-35 82-78 100-44 19-94 13-123-40Z" opacity=".9"/>
        <path fill="url(#river)" d="M17 186c34 22 76 29 118 20 37-8 66-27 87-51 0 28-17 52-48 69-47 24-112 11-157-38Z"/>
        <path fill="url(#fur)" d="M54 123c0-47 36-85 85-85 45 0 78 32 78 75 0 30-17 55-42 69-9 6-14 14-15 24l-2 22H91l-2-27c-1-9-7-18-15-24-13-10-20-30-20-54Z"/>
        <path fill="#fff5df" d="M91 113c10-19 27-29 48-29 23 0 40 11 49 30 7 15 4 33-8 46-10 11-24 17-41 17-18 0-33-6-42-18-11-13-13-31-6-46Z"/>
        <path fill="#d2642f" d="M99 120c10-16 23-24 40-24 18 0 31 8 40 24-10-6-23-9-40-9-16 0-29 3-40 9Z"/>
        <path fill="#72351f" d="M110 129c0-8 6-14 14-14s14 6 14 14-6 14-14 14-14-6-14-14Zm31 0c0-8 6-14 14-14s14 6 14 14-6 14-14 14-14-6-14-14Z"/>
        <path fill="#fff5df" d="M118 125a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm31 0a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
        <path fill="#72351f" d="M132 145c4-5 10-7 17-7s13 2 17 7c-5 4-10 6-17 6s-12-2-17-6Z"/>
        <path fill="none" stroke="#72351f" stroke-linecap="round" stroke-width="6" d="M111 163c18 12 49 12 68-1"/>
        <path fill="#a94524" d="M63 87c-20 21-27 55-16 83-19-20-24-57-13-87 7-19 20-36 38-47-5 14-8 31-9 51Zm157-9c24 24 31 64 17 94 23-21 30-64 16-98-9-23-27-41-51-50 10 16 16 33 18 54Z" opacity=".82"/>
