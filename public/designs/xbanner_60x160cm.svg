  </g>

  <!-- Service List Cards -->
  <g transform="translate(60, 720)">
    <!-- Service 1 -->
    <g transform="translate(0, 0)">
      <rect width="480" height="85" rx="12" fill="#0b3524" stroke="#ffb51b" stroke-width="1.5"/>
      <circle cx="50" cy="42" r="24" fill="#ffb51b"/>
      <text x="50" y="50" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" text-anchor="middle">1</text>
      <text x="95" y="38" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="24" letter-spacing="1">1 TO 5 DAYS JUNGLE TREKKING</text>
      <text x="95" y="64" fill="#edf1e7" font-family="'Segoe UI', sans-serif" font-size="16">Gunung Leuser National Park</text>
    </g>

    <!-- Service 2 -->
    <g transform="translate(0, 105)">
      <rect width="480" height="85" rx="12" fill="#0b3524" stroke="#ffb51b" stroke-width="1.5"/>
      <circle cx="50" cy="42" r="24" fill="#ffb51b"/>
      <text x="50" y="50" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" text-anchor="middle">2</text>
      <text x="95" y="38" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="24" letter-spacing="1">WILD ORANGUTAN ENCOUNTERS</text>
      <text x="95" y="64" fill="#edf1e7" font-family="'Segoe UI', sans-serif" font-size="16">Respectful &amp; Ethical Wildlife Watching</text>
    </g>

    <!-- Service 3 -->
    <g transform="translate(0, 210)">
      <rect width="480" height="85" rx="12" fill="#0b3524" stroke="#ffb51b" stroke-width="1.5"/>
      <circle cx="50" cy="42" r="24" fill="#ffb51b"/>
      <text x="50" y="50" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" text-anchor="middle">3</text>
      <text x="95" y="38" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="24" letter-spacing="1">CERTIFIED LOCAL GUIDES</text>
      <text x="95" y="64" fill="#edf1e7" font-family="'Segoe UI', sans-serif" font-size="16">Experienced, Licensed &amp; English Speaking</text>
    </g>

    <!-- Service 4 -->
    <g transform="translate(0, 315)">
      <rect width="480" height="85" rx="12" fill="#0b3524" stroke="#ffb51b" stroke-width="1.5"/>
      <circle cx="50" cy="42" r="24" fill="#ffb51b"/>
      <text x="50" y="50" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" text-anchor="middle">4</text>
      <text x="95" y="38" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="24" letter-spacing="1">TRADITIONAL RIVER TUBING</text>
      <text x="95" y="64" fill="#edf1e7" font-family="'Segoe UI', sans-serif" font-size="16">Jungle River Rafting Return Journey</text>
    </g>
