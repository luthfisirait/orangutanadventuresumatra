  <g transform="translate(45, 1190)" filter="url(#shadowVert)">
    <rect width="510" height="340" rx="16" fill="#071b14" stroke="#d2642f" stroke-width="3"/>

    <!-- WhatsApp Row -->
    <g transform="translate(30, 35)">
      <circle cx="32" cy="32" r="28" fill="#25D366"/>
      <path d="M23 18c-1-2-3-2-4-2s-3 1-4 2c-3 3-3 8 2 14 6 7 12 7 15 4 1-1 2-2 2-4s-1-3-3-4l-3-1c-1 0-2 0-2 1l-1 2c-1 0-3-1-5-3s-3-4-3-5l2-1c1-1 1-2 1-3z" fill="#ffffff"/>
      <text x="75" y="24" fill="#88c999" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">WHATSAPP BOOKING</text>
      <text x="75" y="52" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="30" letter-spacing="1">+62 853 6240 5752</text>
    </g>

    <!-- Divider -->
    <line x1="30" y1="125" x2="480" y2="125" stroke="#1d5a40" stroke-width="1.5"/>

    <!-- Website Row -->
    <g transform="translate(30, 150)">
      <circle cx="32" cy="32" r="28" fill="#0e6b76"/>
      <circle cx="32" cy="32" r="16" fill="none" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="32" cy="32" rx="8" ry="16" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="16" y1="32" x2="48" y2="32" stroke="#fff" stroke-width="2"/>
      <text x="75" y="24" fill="#80cbd4" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">OFFICIAL WEBSITE</text>
      <text x="75" y="52" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="23" letter-spacing="0.5">orangutanadventuresumatra.com</text>
    </g>

    <!-- Divider -->
    <line x1="30" y1="240" x2="480" y2="240" stroke="#1d5a40" stroke-width="1.5"/>

    <!-- Instagram Row -->
    <g transform="translate(30, 260)">
      <circle cx="32" cy="32" r="28" fill="#d2642f"/>
      <path d="M32 18c-6 0-10 4-10 10 0 8 10 18 10 18s10-10 10-18c0-6-4-10-10-10zm0 13c-2 0-3-1-3-3s1-3 3-3 3 1 3 3-1 3-3 3z" fill="#ffffff"/>
      <text x="75" y="22" fill="#ffb51b" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">INSTAGRAM</text>
      <text x="75" y="50" fill="#ffffff" font-family="'Impact', Arial, sans-serif" font-size="24" letter-spacing="1">@orangutanadventuresumatra</text>
    </g>
  </g>
</svg>
