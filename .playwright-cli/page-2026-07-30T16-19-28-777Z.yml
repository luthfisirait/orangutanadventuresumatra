      - paragraph [ref=e373]: "The vision behind selected OrangutanAdventureSumatra packages is to reserve part of travel income for rainforest conservation support and community benefit around Bukit Lawang. The goal is practical: keep skilled local people employed, reduce pressure on the forest, and help guests understand why ethical wildlife rules matter."
