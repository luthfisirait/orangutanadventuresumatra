    - generic [ref=e363]:
      - generic [ref=e364]: Responsible trekking
      - heading "The best orangutan encounter is still a wild one." [level=2] [ref=e365]
      - paragraph [ref=e366]: "Syaipul follows jungle rules that protect guests, the guide, and animals: keep distance, stay with the guide, never feed wildlife, never touch orangutans, and avoid flash or behavior that changes how animals move through the forest."
