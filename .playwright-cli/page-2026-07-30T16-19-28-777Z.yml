      - img "Small trekking group hiking a Bukit Lawang rainforest trail overlooking the valley" [ref=e290]
      - generic [ref=e291]:
        - generic [ref=e292]: Package activity details
        - heading "What a classic multi-day Bukit Lawang trek feels like" [level=2] [ref=e293]
        - paragraph [ref=e294]: "The flow below follows a typical 3-day orangutan trekking package: slow wildlife watching, forest meals, riverside camping, and a tube-rafting return. The final route can change with weather, group fitness, river level, and park guidance."
        - generic [ref=e295]:
          - article [ref=e296]:
            - text: Day 1
            - heading "Bukit Lawang trailhead, orangutan habitat, first camp" [level=3] [ref=e297]
            - paragraph [ref=e298]: Meet your guide in the morning, check water and footwear, then enter the rainforest at an easy pace. The first day focuses on respectful wildlife observation, forest plants, fruit breaks, lunch in the jungle, and arrival at a simple riverside camp.
          - article [ref=e299]:
            - text: Day 2
            - heading "Deeper forest walking, river breaks, second night" [level=3] [ref=e300]
            - paragraph [ref=e301]: Continue into quieter forest sections with more time for Thomas leaf monkeys, gibbons, macaques, birds, medicinal plants, and rainforest sounds. Expect climbs, muddy trails in rain season, a fresh jungle lunch, and a second camp near water when conditions allow.
          - article [ref=e302]:
            - text: Day 3
            - heading "Morning trek and traditional tube rafting return" [level=3] [ref=e303]
            - paragraph [ref=e304]: After breakfast, walk a shorter final route or relax by the river before returning toward Bukit Lawang by traditional tube rafting when it is included and river conditions are safe.
        - generic [ref=e305]:
          - link "See the 3-day trek page" [ref=e306] [cursor=pointer]:
            - /url: /3-day-bukit-lawang-orangutan-trek
            - text: See the 3-day trek page
            - img [ref=e307]
          - link "Read the 3-day itinerary guide" [ref=e309] [cursor=pointer]:
            - /url: /blog/3-day-bukit-lawang-jungle-trek-itinerary
            - text: Read the 3-day itinerary guide
